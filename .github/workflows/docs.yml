name: docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Create documentation environment
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python "maturin>=1.7,<2.0" "sphinx>=8,<10" "furo>=2024.8.6"

      - name: Prepare embedded WebAssembly assets
        run: |
          mkdir -p crates/wasm/pkg
          touch crates/wasm/pkg/cosmol_viewer_wasm.js
          touch crates/wasm/pkg/cosmol_viewer_wasm_bg.wasm

      - name: Install Python package
        run: .venv/bin/maturin develop --manifest-path crates/python/Cargo.toml

      - name: Build HTML documentation
        run: |
          rm -rf crates/python/docs/_build/html
          .venv/bin/python -m sphinx -W --keep-going -E -b html crates/python/docs/source crates/python/docs/_build/html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: crates/python/docs/_build/html

  deploy:
    name: deploy docs
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
